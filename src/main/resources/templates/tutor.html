<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Tutor</title>
</head>
<body>
    <h1>Informações do Tutor</h1>
    
    <p><strong>Nome:</strong> <span th:text="${nomeTutor}"></span></p>

    <p><strong>Quantidade de Animais que possui:</strong> <span th:text="${qtdAnimais}"></span></p>
</body>
</html>
